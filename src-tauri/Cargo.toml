[package]
name = "kilonote"
version = "0.1.1"
description = "KiloNote — a light, keyboard-driven note-taking app with built-in task tracking"
license = "MIT"
repository = "https://github.com/Damoy/kilonote"
authors = ["Damoy"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
