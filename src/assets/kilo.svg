<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Kilo, la mascotte KiloNote">
  <title>Kilo</title>
  <g stroke="#2B2A4A" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- antenne « bit » -->
    <path d="M118 42 V24" fill="none"/>
    <rect x="109" y="11" width="18" height="18" rx="4" fill="#8B7CF6"/>
    <!-- pieds -->
    <rect x="88" y="200" width="24" height="20" rx="9" fill="#2B2A4A"/>
    <rect x="144" y="200" width="24" height="20" rx="9" fill="#2B2A4A"/>
    <!-- crayon -->
    <g transform="translate(218 140) rotate(28)">
      <rect x="-8" y="-46" width="16" height="12" rx="3" fill="#FF8FA3"/>
      <rect x="-8" y="-34" width="16" height="50" fill="#FFC24B"/>
      <path d="M-8 16 L0 34 L8 16 Z" fill="#F7E1B5"/>
    </g>
    <!-- bras gauche -->
    <ellipse cx="56" cy="152" rx="11" ry="15" fill="#FFF6DF" transform="rotate(20 56 152)"/>
    <!-- corps : une note au coin plié -->
    <path d="M82 42 H162 L200 80 V186 Q200 208 178 208 H82 Q60 208 60 186 V64 Q60 42 82 42 Z" fill="#FFF6DF"/>
    <path d="M162 42 V68 Q162 80 174 80 H200 Z" fill="#F6D58A"/>
    <!-- bras droit qui tient le crayon -->
    <ellipse cx="203" cy="150" rx="11" ry="14" fill="#FFF6DF"/>
  </g>
  <!-- visage -->
  <rect x="94" y="94" width="18" height="24" rx="6" fill="#2B2A4A"/>
  <rect x="144" y="94" width="18" height="24" rx="6" fill="#2B2A4A"/>
  <rect x="98" y="98" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
  <rect x="148" y="98" width="6" height="6" rx="1.5" fill="#FFFFFF"/>
  <ellipse cx="88" cy="132" rx="11" ry="6.5" fill="#FF8FA3" opacity="0.75"/>
  <ellipse cx="168" cy="132" rx="11" ry="6.5" fill="#FF8FA3" opacity="0.75"/>
  <path d="M118 128 Q123 135 128 128 Q133 135 138 128" fill="none" stroke="#2B2A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- lignes de tâches : à faire / en cours / fait -->
  <g stroke-linecap="round">
    <circle cx="86" cy="160" r="5" fill="#9ECE6A"/>
    <path d="M100 160 H170" stroke="#D9CDB0" stroke-width="6"/>
    <circle cx="86" cy="180" r="5" fill="#E0AF68"/>
    <path d="M100 180 H148" stroke="#D9CDB0" stroke-width="6"/>
  </g>
</svg>
