# Builds the Windows, macOS and Linux installers and publishes them in the
# matching GitHub release. Triggered by scripts/release.sh (which pushes a
# "vX.Y.Z" tag), or manually from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Each job asks for what it needs, nothing more.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci --ignore-scripts

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "KiloNote v__VERSION__"
          releaseBody: |
            Light, keyboard-driven notes with built-in task tracking.

            | System | File |
            |---|---|
            | Windows 10/11 | `KiloNote_<version>_x64-setup.exe`: per-user install, no administrator rights; `KiloNote_<version>_x64-portable.exe`: single file, nothing to install |
            | macOS (Intel and Apple Silicon) | `KiloNote_<version>_universal.dmg` |
            | Linux | `.AppImage` (portable), `.deb` (Debian, Ubuntu), `.rpm` (Fedora, openSUSE) |

            `SHA256SUMS.txt` lists the checksum of every file, and every file comes with a signed
            build provenance (`gh attestation verify <file> -R Damoy/kilonote`). The apps are not
            code-signed yet: see the [README](https://github.com/Damoy/kilonote#install) for the
            first-launch steps, and the [security sheet](https://github.com/Damoy/kilonote/blob/main/docs/SECURITY.md)
            for managed workstations.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # The single-file portable exe (used by the Scoop manifest), next to the installer.
      - name: Portable exe (Windows)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/kilonote.exe "KiloNote_${VERSION}_x64-portable.exe"
          gh release upload "v$VERSION" "KiloNote_${VERSION}_x64-portable.exe" --clobber --repo "$GITHUB_REPOSITORY"

  # SHA-256 checksums of every installer, published with the release
  # (to verify a file, or to allow it by hash in a corporate environment).
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed statement that these files were built by this
      # workflow from this repository (verify: gh attestation verify <file> -R Damoy/kilonote).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
      - name: Build provenance of every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "assets/*"

  # Scoop and winget manifests of the new version (packaging/), committed to main.
  packaging:
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Update the manifests
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=$(jq -r .version src-tauri/tauri.conf.json); fi
          bash scripts/update-packaging.sh "$VERSION"
          git add packaging
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Packaging manifests for $VERSION"
          git push
