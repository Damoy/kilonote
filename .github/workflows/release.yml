# Builds the Windows, macOS and Linux installers and publishes them in the
# matching GitHub release. Started by:
#   - a new version on main (the "Version X.Y.Z" commit, e.g. from a Claude Code
#     session): the workflow creates the vX.Y.Z tag itself;
#   - the vX.Y.Z tag pushed by scripts/release.sh (with main: the run of main then
#     sees the tag and does nothing, so nothing is built twice);
#   - a run by hand from the Actions tab: releases the version on main again (to
#     retry a failed release), or only shows what would happen ("dry run").
# Steps: version (what to do, scripts/release-plan.sh) → check (the CI) → tag →
# build → checksums and build provenance → Scoop and winget manifests.
name: Release

on:
  push:
    branches: [main]
    # (Path filters are not applied to tag pushes.)
    paths: [src-tauri/tauri.conf.json]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only show what would be released, publish nothing"
        type: boolean
        default: false

# One release at a time; a release in progress is never cancelled. A dry run has
# a group of its own: it never waits for a release, nor replaces one that waits.
concurrency:
  group: ${{ inputs.dry_run && format('release-dry-run-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

# Each job asks for what it needs, nothing more.
permissions:
  contents: read

jobs:
  # What to release, if anything: the version of src-tauri/tauri.conf.json, and
  # whether its tag still has to be created.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      create_tag: ${{ steps.plan.outputs.create_tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: bash scripts/release-plan.sh

  # The same checks as on every push (tests, build, Rust, macOS, end-to-end):
  # nothing is tagged, built or published before they pass.
  check:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  # A new version on main: its tag, on the commit that was checked. (A tag pushed
  # with the workflow's token starts no other run: no second build.)
  tag:
    needs: [version, check]
    if: needs.version.outputs.create_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag v${{ needs.version.outputs.version }}
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "KiloNote $V" "$GITHUB_SHA"
          git push origin "v$V"

  build:
    needs: [version, check, tag]
    # (always(): also when the tag job was skipped, the tag being there already.)
    if: always() && needs.version.outputs.release == 'true' && needs.check.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      # Exactly the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: System dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        # (A slow package mirror fails the job in minutes instead of holding it for hours.)
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci --ignore-scripts

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "KiloNote v__VERSION__"
          releaseBody: |
            Light, keyboard-driven notes with built-in task tracking.

            | System | File |
            |---|---|
            | Windows 10/11 | `KiloNote_<version>_x64-setup.exe`: per-user install, no administrator rights; `KiloNote_<version>_x64-portable.exe`: single file, nothing to install |
            | macOS (Intel and Apple Silicon) | `KiloNote_<version>_universal.dmg` |
            | Linux | `.AppImage` (portable), `.deb` (Debian, Ubuntu), `.rpm` (Fedora, openSUSE) |

            `SHA256SUMS.txt` lists the checksum of every file, and every file comes with a signed
            build provenance (`gh attestation verify <file> -R Damoy/kilonote`). The apps are not
            code-signed yet: see the [README](https://github.com/Damoy/kilonote#install) for the
            first-launch steps, and the [security sheet](https://github.com/Damoy/kilonote/blob/main/docs/SECURITY.md)
            for managed workstations.

            ## Changes

            ${{ needs.version.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # The single-file portable exe (used by the Scoop manifest), next to the installer.
      - name: Portable exe (Windows)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/kilonote.exe "KiloNote_${VERSION}_x64-portable.exe"
          gh release upload "v$VERSION" "KiloNote_${VERSION}_x64-portable.exe" --clobber --repo "$GITHUB_REPOSITORY"

  # SHA-256 checksums of every installer, published with the release
  # (to verify a file, or to allow it by hash in a corporate environment).
  checksums:
    needs: [version, build]
    # (Spelled out: the build ran with always(), after a tag job that may be skipped.)
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed statement that these files were built by this
      # workflow from this repository (verify: gh attestation verify <file> -R Damoy/kilonote).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
      - name: Build provenance of every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "assets/*"

  # Scoop and winget manifests of the new version (packaging/), committed to main.
  packaging:
    needs: [version, checksums]
    if: always() && needs.checksums.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-tags: true
      - name: Update the manifests
        env:
          # The version released by this run (main may hold a newer one by now).
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # An older version released again (a retry) leaves the manifests of the newest one.
          git fetch --quiet --tags origin
          NEWEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ "v$VERSION" != "$NEWEST" ]; then
            echo "v$VERSION is not the newest version ($NEWEST): the manifests stay as they are."
            exit 0
          fi
          bash scripts/update-packaging.sh "$VERSION"
          git add packaging
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Packaging manifests for $VERSION"
          # (main may have moved while the release was built.)
          git push || { git pull --rebase origin main && git push; }
