# Builds the Windows, macOS and Linux installers and publishes them in the
# matching GitHub release. Triggered by scripts/release.sh (which pushes a
# "vX.Y.Z" tag), or manually from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "KiloNote v__VERSION__"
          releaseBody: |
            Light, keyboard-driven notes with built-in task tracking.

            | System | File |
            |---|---|
            | Windows 10/11 | `KiloNote_<version>_x64-setup.exe`: per-user install, no administrator rights; `KiloNote_<version>_x64-portable.exe`: single file, nothing to install |
            | macOS (Intel and Apple Silicon) | `KiloNote_<version>_universal.dmg` |
            | Linux | `.AppImage` (portable), `.deb` (Debian, Ubuntu), `.rpm` (Fedora, openSUSE) |

            `SHA256SUMS.txt` lists the checksum of every file. The apps are not code-signed yet:
            see the [README](https://github.com/Damoy/kilonote#install) for the first-launch steps.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # The single-file portable exe (used by the Scoop manifest), next to the installer.
      - name: Portable exe (Windows)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/kilonote.exe "KiloNote_${VERSION}_x64-portable.exe"
          gh release upload "v$VERSION" "KiloNote_${VERSION}_x64-portable.exe" --clobber --repo "$GITHUB_REPOSITORY"

  # SHA-256 checksums of every installer, published with the release
  # (to verify a file, or to allow it by hash in a corporate environment).
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
