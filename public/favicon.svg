<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>KiloNote</title>
  <!-- The app icon (source of every size: npm run icons). The mascot, Kilo, lives in the app. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F80FF"/>
      <stop offset="1" stop-color="#4A38CF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEBFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#160E57" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="56" y="56" width="912" height="912" rx="210" fill="url(#plate)"/>
  <rect x="56" y="56" width="912" height="912" rx="210" fill="url(#shine)"/>
  <g transform="translate(-36 -30)">
