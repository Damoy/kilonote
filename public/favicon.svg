    <path fill="#C7BFFF" d="M600 236V340A40 40 0 0 0 640 380H744Z"/>
    <rect x="322" y="420" width="226" height="44" rx="22" fill="#6C5CF2"/>
    <rect x="322" y="514" width="340" height="34" rx="17" fill="#D3CFEE"/>
    <rect x="322" y="586" width="290" height="34" rx="17" fill="#D3CFEE"/>
    <rect x="322" y="658" width="196" height="34" rx="17" fill="#D3CFEE"/>
    <circle cx="738" cy="744" r="112" fill="#2ECF8A" stroke="#FFFFFF" stroke-width="22"/>
    <path d="M684 746L722 784L796 706" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
